# Run with `flutter pub run ffigen --config ffigen.yaml`.
name: OnnxRuntimeBindings
description: |
  Bindings for `src/onnxruntime/onnxruntime_c_api.h`.

  Regenerate bindings with `flutter pub run ffigen --config ffigen_onnxruntime.yaml`.
output: 'lib/src/bindings/onnxruntime_bindings_generated.dart'
headers:
  entry-points:
    - 'src/onnxruntime/coreml_provider_factory.h'
    - 'src/onnxruntime/cpu_provider_factory.h'
    - 'src/onnxruntime/nnapi_provider_factory.h'
    - 'src/onnxruntime/onnxruntime_c_api.h'
  include-directives:
    - 'src/onnxruntime/coreml_provider_factory.h'
    - 'src/onnxruntime/cpu_provider_factory.h'
    - 'src/onnxruntime/nnapi_provider_factory.h'
    - 'src/onnxruntime/onnxruntime_c_api.h'
# Generate the non-Windows shape (ORTCHAR_T = char) on every host, so the
# bindings don't change with the machine that runs ffigen.
compiler-opts:
  - '-U_WIN32'
# C enums are 4-byte ints on all ORT targets.
silence-enum-warning: true
# ORT_FILE expands to __FILE__, i.e. a path on the machine running ffigen.
macros:
  exclude:
    - 'ORT_FILE'
# Keep C enums as int constants; the hand-written code compares raw ints.
enums:
  as-int:
    include:
      - '.*'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
comments:
  style: any
  length: full
